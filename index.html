# switch to it (modern)\ngit switch -c feature         # create AND switch\ngit checkout -b feature       # older equivalent of -c\ngit branch -d feature         # delete merged branch\ngit branch -D feature         # force delete unmerged branch\n```\n\n## Merging\n\n```bash\ngit switch main\ngit merge feature             # merge feature into main\ngit merge --no-ff feature     # always create a merge commit\n```\n\n## Rebasing (linear history)\n\n```bash\ngit switch feature\ngit rebase main               # replay feature commits on top of main\ngit rebase -i HEAD~3          # interactively squash/edit last 3 commits\n```\n\n**Golden rule:** never rebase commits you've already pushed and shared.\n\n## Resolving Conflicts\n\n```bash\n# After a conflicting merge:\ngit status                    # see conflicted files\n# Edit files, remove <<<<<<< ======= >>>>>>> markers\ngit add resolved-file.txt\ngit commit                    # (or git merge --continue)\ngit merge --abort             # bail out entirely\n```\n", "difficulty": 2, "tags": ["git", "vcs", "workflow"]}, {"title": "Undoing Mistakes", "body": "# ⏪ Undoing Mistakes\n\n```bash\n# Discard unstaged changes to a file:\ngit restore file.txt\ngit checkout -- file.txt      # older syntax\n\n# Unstage a file (keep the edits):\ngit restore --staged file.txt\ngit reset HEAD file.txt       # older syntax\n\n# Amend the last commit (message or forgotten files):\ngit commit --amend -m \"better message\"\n\n# Undo last commit, KEEP changes staged:\ngit reset --soft HEAD~1\n\n# Undo last commit, keep changes unstaged:\ngit reset HEAD~1\n\n# Nuke last commit and changes (DANGEROUS):\ngit reset --hard HEAD~1\n```\n\n## Safely Revert a Public Commit\n\n```bash\ngit revert <hash>             # creates a NEW commit that undoes <hash>\n```\n\n## The Safety Net: reflog\n\n```bash\ngit reflog                    # history of where HEAD has been\ngit reset --hard HEAD@{2}     # jump back to a previous state\n```\n\nEven \"lost\" commits usually live in the reflog for ~90 days. Don't panic.\n", "difficulty": 2, "tags": ["git", "vcs", "workflow"]}, {"title": "Remotes & Collaboration", "body": "# 🤝 Remotes & Collaboration\n\n```bash\ngit remote -v                 # list remotes\ngit remote add origin <url>   # add a remote named origin\ngit push -u origin main       # push and set upstream (first time)\ngit push                      # push current branch\ngit pull                      # fetch + merge remote changes\ngit fetch                     # download remote changes, DON'T merge\n```\n\n## Typical Feature Workflow\n\n```bash\ngit switch -c feature/login   # 1. branch\n# ... make changes ...\ngit add . && git commit -m \"Add login form\"\ngit push -u origin feature/login   # 2. push branch\n# 3. open a Pull Request on GitHub/GitLab\n# 4. after review + merge:\ngit switch main && git pull   # 5. sync local main\ngit branch -d feature/login   # 6. clean up\n```\n\n## Useful Remote Commands\n\n```bash\ngit push origin --delete old-branch   # delete remote branch\ngit fetch --prune                     # remove stale remote refs\ngit remote set-url origin <new-url>   # change remote URL\n```\n\n## gh CLI (GitHub)\n\n```bash\nsudo pacman -S github-cli\ngh auth login\ngh pr create                  # open a PR from current branch\ngh pr checkout 42             # check out PR #42 locally\ngh repo clone owner/repo\n```\n", "difficulty": 2, "tags": ["git", "vcs", "workflow"]}, {"title": "Stash, Log & Blame", "body": "# 🔎 Stash, Log & Blame\n\n## Stash — shelve work in progress\n\n```bash\ngit stash                     # save uncommitted changes, clean working dir\ngit stash -u                  # include untracked files\ngit stash list                # see all stashes\ngit stash pop                 # reapply latest stash and remove it\ngit stash apply               # reapply but keep the stash\ngit stash drop                # delete latest stash\ngit stash show -p             # diff of what's stashed\n```\n\n## Searching History\n\n```bash\ngit log --oneline -10                 # last 10 commits, compact\ngit log --author=\"Alice\"              # commits by Alice\ngit log --since=\"2 weeks ago\"\ngit log -p file.txt                   # full diff history of one file\ngit log -S \"functionName\"             # commits that added/removed a string\ngit log --grep=\"bugfix\"               # search commit messages\n```\n\n## Blame — who changed this line?\n\n```bash\ngit blame file.txt            # annotate each line with last commit\ngit blame -L 10,20 file.txt   # only lines 10-20\ngit show <hash>               # full details of a commit\n```\n\n## Find a Bug with Bisect\n\n```bash\ngit bisect start\ngit bisect bad                # current is broken\ngit bisect good v1.0          # v1.0 was fine\n# Git checks out the midpoint; test, then mark good/bad. Repeat.\ngit bisect reset              # when done\n```\n", "difficulty": 3, "tags": ["git", "vcs", "workflow"]}, {"title": "Git Config & Aliases", "difficulty": 2, "tags": ["git", "config", "workflow"], "body": "# ⚙️ Git Config & Aliases\n\n## Useful Global Config\n\n```bash\ngit config --global core.autocrlf input     # LF on checkout (Linux)\ngit config --global push.autoSetupRemote true  # no more -u origin\ngit config --global rerere.enabled true        # remember conflict resolutions\ngit config --global diff.colorMoved zebra      # colored moved lines in diff\ngit config --global log.abbrevCommit true\ngit config --global merge.conflictstyle zdiff3  # better conflict markers\n```\n\n## Powerful Aliases\n\n```bash\ngit config --global alias.lg \"log --oneline --graph --all --decorate\"\ngit config --global alias.st \"status -sb\"\ngit config --global alias.co \"checkout\"\ngit config --global alias.br \"branch\"\ngit config --global alias.unstage \"restore --staged\"\ngit config --global alias.last \"log -1 HEAD --stat\"\ngit config --global alias.aliases \"config --get-regexp alias\"\ngit config --global alias.undo \"reset HEAD~1 --mixed\"\ngit config --global alias.amend \"commit --amend --no-edit\"\n\n# Now:\ngit lg                         # beautiful graph history\ngit st                         # compact status\ngit undo                       # undo last commit, keep changes\n```\n\n## Conditional Config (per directory)\n\n```bash\n# ~/.gitconfig\n[includeIf \"gitdir:~/work/\"]\n    path = ~/.gitconfig-work\n\n# ~/.gitconfig-work\n[user]\n    email = me@company.com\n    signingkey = WORK_KEY_ID\n```\n\n## Sign Your Commits\n\n```bash\ngpg --list-secret-keys --keyid-format LONG\ngit config --global user.signingkey KEY_ID\ngit config --global commit.gpgsign true\n```\n"}], "🖥️ Tmux & Editors": [{"title": "tmux Basics", "body": "# 🖥️ tmux — Terminal Multiplexer\n\nRun multiple terminals in one window, and keep sessions alive after disconnect.\n\n```bash\nsudo pacman -S tmux\n\ntmux                          # start a new session\ntmux new -s work              # named session\ntmux ls                       # list sessions\ntmux attach -t work           # reattach to a session\ntmux kill-session -t work\n```\n\n## The Prefix Key\n\nEvery tmux command starts with the **prefix**: `Ctrl+b` (default), then a key.\n\n| Keys | Action |\n|------|--------|\n| `prefix` `c` | new window |\n| `prefix` `n` / `p` | next / previous window |\n| `prefix` `0-9` | jump to window N |\n| `prefix` `,` | rename window |\n| `prefix` `%` | split pane vertically |\n| `prefix` `\"` | split pane horizontally |\n| `prefix` `←↑↓→` | move between panes |\n| `prefix` `z` | zoom pane (toggle fullscreen) |\n| `prefix` `d` | detach (session keeps running!) |\n| `prefix` `[` | scroll mode (q to exit) |\n\n## Why It's Great\n\nRun a long job over SSH, `prefix d` to detach, close your laptop — the job keeps\nrunning on the server. Reconnect later with `tmux attach`.\n\n## Minimal ~/.tmux.conf\n\n```bash\nset -g mouse on               # mouse support\nset -g base-index 1           # windows start at 1\nsetw -g mode-keys vi          # vi keys in scroll mode\n```\n", "difficulty": 2, "tags": ["tools", "editors", "terminal"]}, {"title": "Vim Survival Guide", "body": "# ⌨️ Vim Survival Guide\n\nVim is modal: keys do different things in different modes.\n\n## The Modes\n\n| Mode | Enter with | Purpose |\n|------|-----------|---------|\n| Normal | `Esc` | navigate & run commands |\n| Insert | `i` | type text |\n| Visual | `v` | select text |\n| Command | `:` | save, quit, search |\n\n## Escaping (the famous question)\n\n```\n:w      save\n:q      quit\n:wq     save and quit\n:q!     quit WITHOUT saving\n:x      save and quit (only writes if changed)\nZZ      save and quit (normal mode, no colon)\n```\n\n## Movement (Normal mode)\n\n```\nh j k l   left, down, up, right\nw / b     next / previous word\n0 / $     start / end of line\ngg / G    top / bottom of file\n:42       go to line 42\nCtrl+d/u  half page down / up\n```\n\n## Editing\n\n```\ni  a      insert before / after cursor\no  O      open new line below / above\nx         delete character\ndd        delete (cut) line\nyy        yank (copy) line\np         paste\nu         undo\nCtrl+r    redo\n.         repeat last change\n```\n\n## Search & Replace\n\n```\n/word            search forward (n = next, N = prev)\n:%s/old/new/g    replace all in file\n:%s/old/new/gc   replace all, confirm each\n```\n\n**Tip:** run `vimtutor` in your terminal for a free 30-minute interactive lesson.\n", "difficulty": 1, "tags": ["tools", "editors", "terminal"]}, {"title": "nano (the simple editor)", "body": "# 📝 nano — The Beginner-Friendly Editor\n\nWhen you just need to edit a config fast and Vim feels like too much.\n\n```bash\nnano file.txt                 # open (or create) a file\nnano +25 file.txt             # open at line 25\nsudo nano /etc/fstab          # edit a system file\n```\n\n## Shortcuts (`^` means Ctrl)\n\n| Keys | Action |\n|------|--------|\n| `^O` | write Out (save) — then Enter |\n| `^X` | exit |\n| `^W` | Where is (search) |\n| `^\\` | search and replace |\n| `^K` | cut current line |\n| `^U` | paste (uncut) |\n| `^G` | help |\n| `^_` | go to line number |\n| `^A` / `^E` | start / end of line |\n| `M-U` | undo (M = Alt) |\n\nThe shortcut bar is always shown at the bottom — no memorization needed.\n\n## Make it nicer (~/.nanorc)\n\n```bash\nset linenumbers               # show line numbers\nset tabsize 4\nset tabstospaces\nset autoindent\ninclude /usr/share/nano/*.nanorc   # syntax highlighting\n```\n", "difficulty": 1, "tags": ["tools", "editors", "terminal"]}, {"title": "tmux Config & Workflows", "difficulty": 2, "tags": ["tmux", "terminal", "workflow"], "body": "# ⚙️ Tmux Config & Power Workflows\n\n## A Solid `~/.tmux.conf`\n\n```bash\n# Quality of life\nset -g mouse on                    # mouse support\nset -g base-index 1                # windows start at 1\nsetw -g pane-base-index 1\nset -g history-limit 10000\nset -g escape-time 0               # no delay after Escape\n\n# Better prefix: Ctrl+a (like screen)\nunbind C-b\nset -g prefix C-a\nbind C-a send-prefix\n\n# Pane navigation with Alt+arrow (no prefix needed)\nbind -n M-Left  select-pane -L\nbind -n M-Right select-pane -R\nbind -n M-Up    select-pane -U\nbind -n M-Down  select-pane -D\n\n# Easier splits\nbind | split-window -h -c \"#{pane_current_path}\"\nbind - split-window -v -c \"#{pane_current_path}\"\n\n# Reload config\nbind r source-file ~/.tmux.conf \\; display \"Reloaded!\"\n\n# Vi keys in copy mode\nsetw -g mode-keys vi\nbind-key -T copy-mode-vi v send-keys -X begin-selection\nbind-key -T copy-mode-vi y send-keys -X copy-selection\n\n# Status bar\nset -g status-style bg='#161b22',fg='#8b949e'\nset -g window-status-current-style fg='#58a6ff',bold\n```\n\n## Power Workflows\n\n```bash\n# Open a new pane in the same directory:\nprefix |    # split right, same dir\nprefix -    # split down, same dir\n\n# Sync panes (type in all at once):\nprefix :setw synchronize-panes on\n\n# Save/restore sessions (with tmux-resurrect):\n# prefix Ctrl+s = save; prefix Ctrl+r = restore\n```\n"}, {"title": "Neovim — Getting Started", "difficulty": 2, "tags": ["neovim", "editor", "vim"], "body": "# 📝 Neovim — The Modern Vim\n\nNeovim is a modernized Vim fork with Lua config, LSP support, and a huge plugin ecosystem.\n\n```bash\nsudo pacman -S neovim\n```\n\n## Why Neovim over Vim?\n\n- **Lua config** — faster and more expressive than Vimscript\n- **Built-in LSP** — language server protocol for IDE-like features\n- **Tree-sitter** — better syntax highlighting\n- **Async** — plugins don't block the UI\n\n## Sensible Defaults (`~/.config/nvim/init.lua`)\n\n```lua\n-- Basic settings\nvim.opt.number = true            -- line numbers\nvim.opt.relativenumber = true    -- relative numbers\nvim.opt.tabstop = 4\nvim.opt.shiftwidth = 4\nvim.opt.expandtab = true\nvim.opt.smartindent = true\nvim.opt.wrap = false\nvim.opt.termguicolors = true\n\n-- Better search\nvim.opt.ignorecase = true\nvim.opt.smartcase = true\n\n-- Clipboard\nvim.opt.clipboard = \"unnamedplus\"   -- system clipboard\n\n-- Keymaps (leader = space)\nvim.g.mapleader = \" \"\nvim.keymap.set(\"n\", \"<leader>w\", \":w<CR>\")\nvim.keymap.set(\"n\", \"<leader>q\", \":q<CR>\")\nvim.keymap.set(\"n\", \"<Esc>\", \":noh<CR>\")  -- clear search highlight\n```\n\n## Recommended Distros (if you don't want to configure from scratch)\n\n- **LazyVim** — modern, well-curated: `https://lazyvim.org`\n- **AstroNvim** — beautiful out of the box\n- **kickstart.nvim** — minimal starting point you actually understand\n"}, {"title": "Shell Multiplexing Patterns", "difficulty": 3, "tags": ["tmux", "zsh", "workflow", "ssh"], "body": "# 🔀 Shell Multiplexing Patterns\n\n## Persistent Dev Environment\n\nThe real power: your whole dev environment lives in named sessions.\n\n```bash\n# Setup script (~/.local/bin/dev):\n#!/bin/bash\nSESSION=\"dev\"\ntmux new-session -d -s $SESSION -n editor 2>/dev/null || true\ntmux new-window -t $SESSION:2 -n server\ntmux new-window -t $SESSION:3 -n logs\ntmux send-keys -t $SESSION:1 \"nvim\" Enter\ntmux send-keys -t $SESSION:2 \"cd ~/project && npm run dev\" Enter\ntmux send-keys -t $SESSION:3 \"journalctl -f\" Enter\ntmux select-window -t $SESSION:1\ntmux attach-session -t $SESSION\n```\n\n## SSH + tmux: Never Lose Work\n\n```bash\n# On remote server, always attach or create:\nssh server \"tmux attach || tmux new -s main\"\n\n# Or add to ~/.ssh/config:\n# Host myserver\n#   RequestTTY yes\n#   RemoteCommand tmux attach || tmux new\n```\n\n## Nested tmux (local + remote)\n\n```bash\n# When inside a remote tmux, prefix key conflict solution:\n# Outer: Ctrl+a, Inner: Ctrl+b\n# Double-prefix to send to inner: Ctrl+a Ctrl+b\n\n# Or toggle off outer tmux:\nbind -n C-F11 set -qg status off \\; set -qg prefix None\nbind -n C-F12 set -qg status on  \\; set -qg prefix C-a\n```\n\n## tmux + fzf Session Switcher\n\n```bash\n# Add to ~/.zshrc:\nts() {\n  local session\n  session=$(tmux list-sessions -F '#{session_name}' 2>/dev/null | fzf --exit-0)     && tmux switch-client -t \"$session\" || tmux new-session -d -s \"${1:-main}\" && tmux switch-client -t \"${1:-main}\"\n}\n```\n"}], "🐳 Docker": [{"title": "Docker Basics", "difficulty": 2, "tags": ["docker", "containers", "devops"], "body": "# 🐳 Docker Basics\n\nDocker packages apps and their dependencies into portable containers.\n\n```bash\nsudo pacman -S docker\nsudo systemctl enable --now docker\nsudo usermod -aG docker $USER   # run docker without sudo (re-login after)\n```\n\n## Core Concepts\n\n| Term | Meaning |\n|------|---------|\n| **Image** | Read-only template (like a class) |\n| **Container** | Running instance of an image (like an object) |\n| **Registry** | Hub where images are stored (Docker Hub) |\n| **Volume** | Persistent storage for containers |\n\n## Essential Commands\n\n```bash\ndocker pull nginx               # download an image\ndocker images                   # list local images\ndocker run nginx                # run a container (downloads if needed)\ndocker run -d nginx             # run in background (detached)\ndocker ps                       # list running containers\ndocker ps -a                    # all containers (including stopped)\ndocker stop <id>                # stop a container\ndocker rm <id>                  # remove a stopped container\ndocker rmi nginx                # remove an image\n```\n"}, {"title": "Running Containers", "difficulty": 2, "tags": ["docker", "containers", "ports"], "body": "# 🚀 Running Containers\n\n```bash\n# Map ports: -p host:container\ndocker run -d -p 8080:80 nginx       # nginx on localhost:8080\n\n# Name your containers:\ndocker run -d --name myapp -p 3000:3000 node:20\n\n# Environment variables:\ndocker run -e POSTGRES_PASSWORD=secret postgres\n\n# Mount a volume:\ndocker run -v /host/data:/container/data nginx\n\n# Interactive shell inside a container:\ndocker run -it ubuntu bash\ndocker exec -it myapp bash           # shell in running container\n\n# Logs:\ndocker logs myapp\ndocker logs -f myapp                 # follow (like tail -f)\n```\n\n## Useful Combos\n\n```bash\n# Stop and remove all containers:\ndocker stop $(docker ps -q) && docker rm $(docker ps -aq)\n\n# Remove all unused images:\ndocker image prune -a\n\n# See what's running + resource usage:\ndocker stats\n\n# Copy a file into a running container:\ndocker cp file.txt myapp:/app/file.txt\n```\n"}, {"title": "Dockerfile", "difficulty": 2, "tags": ["docker", "dockerfile", "build"], "body": "# 📄 Dockerfile — Build Your Own Image\n\nA Dockerfile is a recipe for building a custom image.\n\n```dockerfile\n# Dockerfile\nFROM python:3.12-slim            # base image\n\nWORKDIR /app                     # working directory inside container\n\nCOPY requirements.txt .          # copy files from host\nRUN pip install -r requirements.txt  # run commands during build\n\nCOPY . .                         # copy the rest of the source\n\nEXPOSE 8000                      # document which port to use\n\ const SH_KW = new Set([
  'if','then','else','elif','fi','for','while','do','done','case','esac',
  'function','return','local','export','source','alias','unset','true','false',
  'exit','break','continue','in','declare','readonly','typeset','select',

const SH_BI = new Set([
  'echo','printf','read','test','cd','pwd','ls','mkdir','rm','cp','mv',
  'cat','grep','find','sed','awk','sort','uniq','wc','head','tail','tr',
  'cut','xargs','tee','date','sleep','kill','which','type','curl','wget',
  'sudo','apt','pacman','pip','pip3','python','python3','git','ssh','scp',
  'rsync','chmod','chown','chgrp','touch','ln','stat','du','df','mount',
  'umount','ps','top','pkill','pgrep','systemctl','journalctl','ip','ping',

  'cargo','rustc','tmux','vim','nvim','nano','less','more','man','bc',

]);

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlightLine(line) {
  let out = '', i = 0, n = line.length;
  while (i < n) {
    const ch = line[i];
    // Comment (only when preceded by whitespace or at start)
    if (ch === '#' && (i === 0 || /[\s\t(|&;]/.test(line[i-1]))) {
      out += '<span class="sh-cm">' + esc(line.slice(i)) + '</span>';
      return out;
    }
    // Single-quoted string
    if (ch === "'") {
      let j = i + 1;
      while (j < n && line[j] !== "'") j++;
      out += '<span class="sh-str">' + esc(line.slice(i, j+1)) + '</span>';
      i = j + 1; continue;
    }
    // Double-quoted string (with $VAR highlighting inside)
    if (ch === '"') {
      let j = i + 1;
      while (j < n && line[j] !== '"') { if (line[j] === '\\') j++; j++; }
      const raw = esc(line.slice(i, j+1));
      // Highlight $VAR / ${VAR} inside the already-escaped string
      const inner = raw.replace(
        /\$\{[^}]+\}|\$[a-zA-Z_][a-zA-Z0-9_]*|\$[#@*?!0-9]/g,
        m => '<span class="sh-var">'+m+'</span>'
      );
      out += '<span class="sh-str">' + inner + '</span>';
      i = j + 1; continue;
    }
    // $(...) subshell or variable
    if (ch === '$') {
      let j = i + 1;
      if (j < n && line[j] === '(') {
        // $( ) — scan for balanced close, render whole thing as var
        let depth = 1; j++;
        while (j < n && depth > 0) {
          if (line[j] === '(') depth++;
          if (line[j] === ')') depth--;
          j++;
        }
      } else if (j < n && line[j] === '{') {
        let end = line.indexOf('}', j); j = end !== -1 ? end+1 : n;
      } else {
        while (j < n && /[a-zA-Z0-9_#@*?!]/.test(line[j])) j++;
      }
      out += '<span class="sh-var">' + esc(line.slice(i, j)) + '</span>';
      i = j; continue;
    }
    // Flag: -x or --long, preceded by space/start
    if (ch === '-' && (i === 0 || /[\s\t(|&;]/.test(line[i-1])) && i+1 < n && /[-a-zA-Z]/.test(line[i+1])) {
      let j = i + 1;
      while (j < n && /[a-zA-Z0-9_=-]/.test(line[j])) j++;
      out += '<span class="sh-flag">' + esc(line.slice(i, j)) + '</span>';
      i = j; continue;
    }
    // Operators
    if ('|&;<>(){}[]'.includes(ch)) {
      out += '<span class="sh-op">' + esc(ch) + '</span>';
      i++; continue;
    }
    // Word: keyword, builtin, or identifier
    if (/[a-zA-Z_]/.test(ch)) {
      let j = i;
      while (j < n && /[a-zA-Z0-9_\-\.\/]/.test(line[j])) j++;
      const w = line.slice(i, j);
      if (SH_KW.has(w))      out += '<span class="sh-kw">'+esc(w)+'</span>';
      else if (SH_BI.has(w)) out += '<span class="sh-bi">'+esc(w)+'</span>';
      else                    out += esc(w);
      i = j; continue;
    }
    // Number
    if (/[0-9]/.test(ch)) {
      let j = i;
      while (j < n && /[0-9.]/.test(line[j])) j++;
      out += '<span class="sh-num">'+esc(line.slice(i,j))+'</span>';
      i = j; continue;
    }
    out += esc(ch); i++;
  }
  return out;
}

const BASH_LANGS = new Set(['', 'bash', 'sh', 'shell', 'zsh', 'fish']);

function highlightCode(raw, lang) {
  if (BASH_LANGS.has(lang)) {
    return raw.split('\n').map(highlightLine).join('\n');
  }
  // Generic: only comment lines
  return raw.split('\n').map(line => {
    const t = line.trimStart();
    if (t.startsWith('#') || t.startsWith('//') || t.startsWith('--')) {
      return '<span class="sh-cm">'+esc(line)+'</span>';
    }
    if (t.startsWith('---') || t.match(/^[A-Z][A-Z_]+\s*:/)) {
      return '<span class="sh-kw">'+esc(line)+'</span>';  // YAML/Dockerfile keys
    }
    return esc(line);
  }).join('\n');
}

/* ── Markdown renderer ──────────────────────────────────────────────────────── */
function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code class="inline">$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return s;
}

function render(md) {
  const lines = md.split('\n');
  let html = '', i = 0;
  while (i < lines.length) {
    let line = lines[i];
    if (line.startsWith('```')) {
      const lang = line.slice(3).trim().toLowerCase();
      const code = [];
      i++;
      while (i < lines.length && !lines[i].startsWith('```')) { code.push(lines[i]); i++; }
      i++;
      const highlighted = highlightCode(code.join('\n'), lang);
      const langTag = lang ? `<span class="lang-tag">${esc(lang)}</span>` : '';
      html += `<div class="codeblock">${langTag}<button class="copy" onclick="copyCode(this)">copy</button><pre>${highlighted}</pre></div>`;
      continue;
    }
    if (line.startsWith('### ')){ html += '<h3>'+inline(line.slice(4))+'</h3>'; i++; continue; }
    if (line.startsWith('## ')) { html += '<h2>'+inline(line.slice(3))+'</h2>'; i++; continue; }
    if (line.startsWith('# '))  { html += '<h1>'+inline(line.slice(2))+'</h1>'; i++; continue; }
    if (line.trim() === '---')  { html += '<hr>'; i++; continue; }
    if (line.trim().startsWith('|')) {
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith('|')) { rows.push(lines[i]); i++; }
      html += renderTable(rows); continue;
    }
    if (/^[-*] /.test(line)) {
      const items = [];
      while (i < lines.length && /^[-*] /.test(lines[i])) { items.push(lines[i].slice(2)); i++; }
      html += '<ul>'+items.map(t => '<li>'+inline(t)+'</li>').join('')+'</ul>';
      continue;
    }
    if (line.trim() === '') { i++; continue; }
    html += '<p>'+inline(line)+'</p>'; i++;
  }
  return html;
}

function renderTable(rows) {
  const cells = r => r.trim().replace(/^\||\|$/g,'').split('|').map(c => c.trim());
  if (rows.length < 2) return '';
  const head = cells(rows[0]);
  let h = '<table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>';
  for (let r = 2; r < rows.length; r++) {
    h += '<tr>'+cells(rows[r]).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>';
  }
  return h + '</tbody></table>';
}

    });

    tree.appendChild(wrap);
    if (!catVisible) catEl.style.display = 'none';
    else catEl.style.display = '';
    if (q || curDiff) catEl.classList.remove('collapsed');
  });
}

/* ── Load lesson ─────────────────────────────────────────────────────────────── */
function load(cat, i) {
  // Save current notes before switching
  if (cur[0] !== cat || cur[1] !== i) {
    const oldKey = k(cur[0], cur[1]);
    const val = document.getElementById('notesArea').value;
    if (val.trim()) { notes[oldKey] = val; saveNotes(); }
    else if (notes[oldKey]) { delete notes[oldKey]; saveNotes(); }
  }
  cur = [cat, i];
  const lesson = LESSONS[cat][i];
  const dl = lesson.difficulty || 2;

  document.getElementById('content').innerHTML = render(lesson.body);
  document.getElementById('content').scrollTop = 0;

  const learned = progress.has(k(cat,i)), fav = favorites.has(k(cat,i));
  document.getElementById('crumb').innerHTML =
    '<span class="diff-badge">'+DIFF_ICON[dl]+' '+DIFF_NAME[dl]+'</span>'+
    '<span class="trail">'+esc(cat)+' › '+esc(lesson.title)+
    '  <span class="mark'+(learned?' learned':'')+'">['+(learned?'✓ learned':'○ not learned')+']</span>'+
    (fav?' <span class="fav">★</span>':'')+
    '</span>';
  document.getElementById('learnBtn').className = 'btn'+(learned?' on':'');
  document.getElementById('learnBtn').textContent = learned ? '✓ Learned' : '✓ Mark Learned';
  document.getElementById('favBtn').className = 'btn fav'+(fav?' on':'');

  // Load notes for this lesson
  document.getElementById('notesArea').value = notes[k(cat,i)] || '';

  buildTree(); // rebuild to highlight active + update note dots
}

/* ── Notes auto-save ─────────────────────────────────────────────────────────── */
document.getElementById('notesArea').addEventListener('input', () => {
  const key = k(cur[0], cur[1]);
  const val = document.getElementById('notesArea').value;
  if (val.trim()) { notes[key] = val; }
  else { delete notes[key]; }
  saveNotes();
});

/* ── Actions ─────────────────────────────────────────────────────────────────── */
function toggleLearned() {
  const key = k(cur[0], cur[1]);
  progress.has(key) ? progress.delete(key) : progress.add(key);
  saveProgress(); load(cur[0], cur[1]); updateProgress();
  toast(progress.has(key) ? '✓ Marked as learned' : 'Unmarked');
}
function toggleFav() {
  const key = k(cur[0], cur[1]);
  favorites.has(key) ? favorites.delete(key) : favorites.add(key);
  saveProgress(); load(cur[0], cur[1]);
  toast(favorites.has(key) ? '★ Favorited' : '☆ Unfavorited');
}
function nav(d) {
  let pos = FLAT.findIndex(([c,i]) => c===cur[0] && i===cur[1]);
  pos = (pos + d + FLAT.length) % FLAT.length;
  load(FLAT[pos][0], FLAT[pos][1]);
}
function nextUnlearned() {
  let pos = FLAT.findIndex(([c,i]) => c===cur[0] && i===cur[1]);
  for (let s = 1; s <= FLAT.length; s++) {
    const [c,i] = FLAT[(pos+s)%FLAT.length];
    if (!progress.has(k(c,i))) { load(c,i); toast('⏭ '+LESSONS[c][i].title); return; }
  }
  toast('🎉 Everything is learned!');
}
function randomLesson() {
  const pool = FLAT.filter(([c,i]) => !progress.has(k(c,i)));
  const arr  = pool.length ? pool : FLAT;
  const [c,i] = arr[Math.floor(Math.random()*arr.length)];
  load(c,i); toast('🎲 '+LESSONS[c][i].title);
}
function copyLesson() {
  const l = LESSONS[cur[0]][cur[1]];
  navigator.clipboard.writeText('# '+l.title+'\n\n'+l.body);
  toast('📋 Copied lesson to clipboard');
}
function copyCode(btn) {
  navigator.clipboard.writeText(btn.parentElement.querySelector('pre').innerText);
  btn.textContent = 'copied!';
  setTimeout(() => btn.textContent = 'copy', 1200);
}

function exportMd() {
  let md = '# Arch Academy — My Notes & Favorites\n\n';
  let count = 0;
  CATS.forEach(cat => {
    LESSONS[cat].forEach((lesson, i) => {
      const key = k(cat, i);
      const isFav = favorites.has(key);
      const myNote = notes[key] && notes[key].trim();
      if (!isFav && !myNote) return;
      count++;
      md += '## '+lesson.title+'\n';
      md += '_'+cat+'_\n\n';
      if (isFav) md += lesson.body + '\n\n';
      if (myNote) md += '### My Notes\n'+myNote+'\n\n';
      md += '---\n\n';
    });
  });
  if (count === 0) { toast('No favorites or notes yet — star some lessons first!'); return; }
  const blob = new Blob([md], {type:'text/markdown'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'arch-academy-export.md';
  a.click();
  toast('📤 Exported '+count+' lessons');
}

function updateProgress() {
  const total = FLAT.length, done = progress.size;
  const pct = total ? Math.round(100*done/total) : 0;
  document.getElementById('pfill').style.width = pct+'%';
  document.getElementById('pct').textContent  = pct+'%';
  document.getElementById('pct2').textContent = done+'/'+total+' ('+pct+'%)';
  const C = 2*Math.PI*14;
  document.getElementById('ring').style.strokeDashoffset = C*(1-pct/100);
}

/* ── Difficulty filter ───────────────────────────────────────────────────────── */
function filterDiff(d) {
  curDiff = d;
  document.querySelectorAll('.df').forEach((btn, i) => {
    btn.classList.toggle('active', i === d);
  });
  buildTree();
}

/* ── Search ─────────────────────────────────────────────────────────────────── */
document.getElementById('search').addEventListener('input', e => {
  curSearch = e.target.value.trim().toLowerCase();
  buildTree();
});

/* ── Keyboard ─────────────────────────────────────────────────────────────────── */
document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') {
    if (e.key === 'Escape') e.target.blur();
    return;
  }
  if (!document.getElementById('tipOverlay').classList.contains('hidden')) {
    closeTip(); return;
  }
  const map = {
    'n': () => nav(1),    'j': () => nav(1),
    'p': () => nav(-1),   'k': () => nav(-1),
    'u': nextUnlearned,
    'r': randomLesson,
    'c': copyLesson,
    'f': toggleFav,
    '1': () => filterDiff(curDiff===1 ? 0 : 1),
    '2': () => filterDiff(curDiff===2 ? 0 : 2),
    '3': () => filterDiff(curDiff===3 ? 0 : 3),
    'e': () => { e.preventDefault(); document.getElementById('notesArea').focus(); },
    '/': () => { e.preventDefault(); document.getElementById('search').focus(); },
  };
  if (e.key === 'l' || e.key === ' ') { e.preventDefault(); toggleLearned(); return; }
  if (map[e.key]) { map[e.key](); }
});

/* ── Toast ───────────────────────────────────────────────────────────────────── */
let toastT;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 2000);
}

/* ── Tip modal ───────────────────────────────────────────────────────────────── */
function showTip() {
  const tip = TIPS[Math.floor(Math.random()*TIPS.length)];
  document.getElementById('tipTitle').textContent = tip.title;
  document.getElementById('tipCode').textContent  = tip.tip;
}
function closeTip() { document.getElementById('tipOverlay').classList.add('hidden'); }

/* ── Init ───────────────────────────────────────────────────────────────────── */
showTip();
buildTree();
load(CATS[0], 0);
updateProgress();
</script>
</body>
</html>
